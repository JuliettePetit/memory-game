<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Minimal zig-wasm</title>
        <script
            type="module"
            src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"
        ></script>
        <script src="game.js"></script>
        <script type="module" src="pointer.js"></script>
    </head>
    <body>
        <div id="game-layout"></div>
        <div id="win-screen-wrapper">
            <div id="win-screen">
                <p id="win-text">you cleared the board in 24 moves</p>
                <button id="btn-restart">play again</button>
            </div>
        </div>
        <div id="time-layout"></div>
        <div id="chat-layout"></div>
        <div id="persona-layout">
            <model-viewer
                src="res/model/lowpoly.glb"
                camera-controls
                auto-rotate
                rotation-per-second="50deg"
                min-camera-orbit="auto 60deg 3.5m"
                max-camera-orbit="auto 75deg 5m"
            ></model-viewer>
        </div>
        <canvas id="pointer-canvas"></canvas>
    </body>
</html>

<style>
    html {
        background-color: black;
        cursor: none;
    }
    body {
        display: flex;
        justify-content: space-between;
        align-items: center;
        min-height: 100vh;
        width: 100%;
        margin: 0px;
    }

    #game-layout {
        justify-content: center; /* horizontal */
        background-image: url("res/img/layout/gamelayout.png");
        background-repeat: no-repeat;
        background-size: contain;
        width: 600px;
        height: 600px;
        padding: 20px;
        padding-top: 103px;
    }

    .container {
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(4, 1fr);
        gap: 5px;
        background-color: white;
        padding: 5px;
        margin: 0 auto;
    }
    .container div {
        background-color: plum;
        border: 1px solid black;
        text-align: center;
        box-sizing: border-box;
    }

    img {
        width: 100%;
        height: 100%;
        display: block; /* removes the inline whitespace gap */
    }

    button {
        display: block;
        margin: 20px auto;
        background: plum;
        color: white;
        border: 0;
    }

    #win-screen-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: none;
        justify-content: center;
        align-items: center;
    }

    #win-screen {
        border-radius: 12px;
        max-width: 500px;
        font-family: arial;
        text-align: center;
        width: 100%;
        margin: 0px auto;
        padding: 20px auto;
        position: relative;
        background: rebeccapurple;
    }

    #time-layout {
        background-image: url("res/img/layout/timelayout.png");
        background-repeat: no-repeat;
        background-size: contain;
        width: 300px;
        height: 300px;
        padding: 20px;
        padding-top: 30px
    }

    #persona-layout {
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        background-image: url("res/img/layout/personalayout.png");
        background-repeat: no-repeat;
        background-size: contain;
        width: 100%;
        max-width: 380px;
        aspect-ratio: 910 / 1760;
        height: auto;
        padding: 12px;
        padding-top: 68px;
    }

    model-viewer {
        flex: 1;
        width: 100%;
        height: auto
    }

    #pointer-canvas {
    pointer-events: none;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    will-change: transform;
    transform: translateZ(0); // ?
    z-index: 99999;
    }
</style>
