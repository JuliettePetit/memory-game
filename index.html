<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Minimal zig-wasm</title>
        <script src="script.js"></script>
    </head>
    <body>
        <div id="game-layout"></div>
        <div id="win-screen-wrapper">
            <div id="win-screen">
                <p id="win-text">you cleared the board in 24 moves</p>
                <button id="btn-restart">play again</button>
            </div>
        </div>
        <div id="time-layout"></div>
        <div id="chat-layout"></div>
        <div id="persona-layout"></div>
    </body>
</html>

<style>
    html {
        background-color: black;
    }
    body {
        display: flex;
        justify-content: space-between;
        align-items: center;
        min-height: 100vh;
        margin: 0 20px;
    }

    #game-layout {
        justify-content: center; /* horizontal */
        background-image: url("res/layout/gamelayout.png");
        background-repeat: no-repeat;
        background-size: contain;
        width: 600px;
        height: 600px;
        padding: 20px;
        padding-top: 103px;
    }

    .container {
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(4, 1fr);
        gap: 5px;
        background-color: white;
        padding: 5px;
        margin: 0 auto;
    }
    .container div {
        background-color: plum;
        border: 1px solid black;
        text-align: center;
        box-sizing: border-box;
    }

    img {
        width: 100%;
        height: 100%;
        display: block; /* removes the inline whitespace gap */
    }

    button {
        display: block;
        margin: 20px auto;
        background: plum;
        color: white;
        border: 0;
    }

    #win-screen-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: none;
        justify-content: center;
        align-items: center;
    }

    #win-screen {
        border-radius: 12px;
        max-width: 500px;
        font-family: arial;
        text-align: center;
        width: 100%;
        margin: 0px auto;
        padding: 20px auto;
        position: relative;
        background: rebeccapurple;
    }

    #time-layout {
        background-image: url("res/layout/timelayout.png");
        background-repeat: no-repeat;
        background-size: contain;
        width: 300px;
        height: 300px;
        padding: 20px;
        padding-top: 30;
    }

    #persona-layout {
        justify-content: center;
        background-image: url("res/layout/personalayout.png");
        background-repeat: no-repeat;
        background-size: contain;
        width: 310px;
        height: 570px;
    }
</style>
